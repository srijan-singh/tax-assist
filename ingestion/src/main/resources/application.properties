# Configure the Ollama embedding model
spring.ai.ollama.embedding.options.model=llama3.1:8b
spring.ai.ollama.base-url=http://localhost:11434

# Configure the Qdrant vector store
spring.ai.vectorstore.qdrant.collection-name=tax-rules
# The dimension of the collection will be automatically determined by the embedding model's output.
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.use-tls=false
